<!doctype html>
<html lang="en" data-age-mode="LOWER_SECONDARY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563EB" />
    <title>Midas Learning Cloud</title>
    <meta name="description" content="Midas Learning Cloud — student platform, teacher portal and admin panel." />

    <!--
      The type families the default theme asks for. Without these the tokens'
      font stacks fall straight through to system-ui, which is why the product
      read as unstyled regardless of what the theme said.

      A school theme can name a different family (see theme.presets.ts); the
      families below cover every face those presets reference, so a tenant
      switching theme never lands on a font the browser has to substitute.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&family=Baloo+2:wght@600;700;800&family=Merriweather:wght@700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This application requires JavaScript. Please enable it in your browser to continue.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
