name: CI

# Runs on every push and pull request. Until this existed there was no automated
# gate on either application: a type error, a lint failure or a broken test could
# reach the pilot school unnoticed.
on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the run still in flight — the older
# result is about to be superseded and CI minutes are not free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # The Prisma client is generated code that nothing in the repo tracks, so
      # typecheck cannot resolve `@prisma/client` until this has run.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Build last: a production build catches what typecheck does not, such as
      # an import that resolves in dev and not under bundling.
      - name: Build
        run: npm run build
